version: 0.0
os: linux

files:
  - source: /
    destination: /opt/hisaab/deployment

hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 30
      runas: root
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 60
      runas: root
  ValidateService:
    - location: scripts/validate.sh
      timeout: 30
      runas: root
